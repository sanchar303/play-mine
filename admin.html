<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Play Mine — Studio Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --chassis-bg: #0b0d12;
      --bevel-top: rgba(255, 255, 255, 0.17);
      --bevel-left: rgba(255, 255, 255, 0.09);
      --bevel-right: rgba(0, 0, 0, 0.55);
      --bevel-bottom: rgba(0, 0, 0, 0.78);
      --gloss-sheen: linear-gradient(145deg, rgba(255, 255, 255, 0.085) 0%, rgba(255, 255, 255, 0.015) 42%, rgba(255, 255, 255, 0.035) 100%);
      --shadow-extrude:
        14px 14px 30px #030407,
        -9px -9px 22px rgba(34, 41, 56, 0.28),
        inset 0 1px 1px rgba(255, 255, 255, 0.16);
      --shadow-key:
        7px 7px 16px #030407,
        -5px -5px 13px rgba(38, 46, 62, 0.3),
        inset 0 1px 1px rgba(255, 255, 255, 0.2);
      --shadow-key-pressed:
        inset 5px 5px 12px #020305,
        inset -3px -3px 8px rgba(42, 50, 68, 0.22);
      --shadow-well:
        inset 6px 6px 14px #030407,
        inset -4px -4px 10px rgba(35, 42, 56, 0.22);

      --led-ice: #38bdf8;
      --led-amber: #f59e0b;
      --led-emerald: #10b981;
      --led-rose: #f43f5e;
      --chrome-bright: #f8fafc;
      --text-main: #eef2f7;
      --text-dim: #94a0b2;
      --text-mute: #5d6778;

      --r-chassis: 30px;
      --r-module: 22px;
      --r-well: 16px;
      --r-pill: 9999px;
      --ease-haptic: cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      background-color: var(--chassis-bg);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      font-variant-numeric: tabular-nums;
      line-height: 1.5;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 75% 55% at 15% 10%, rgba(56, 189, 248, 0.075), transparent 60%),
        radial-gradient(ellipse 65% 50% at 88% 88%, rgba(245, 158, 11, 0.055), transparent 60%),
        linear-gradient(180deg, #0d1017 0%, #090b10 100%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .shell {
      position: relative;
      z-index: 1;
      max-width: 1360px;
      margin: 0 auto;
      padding: 22px 24px 42px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      min-height: 100vh;
    }

    .neu-chassis {
      background: var(--gloss-sheen), linear-gradient(160deg, #161b26 0%, #0e1118 100%);
      border-radius: var(--r-chassis);
      border-top: 1px solid var(--bevel-top);
      border-left: 1px solid var(--bevel-left);
      border-right: 1px solid var(--bevel-right);
      border-bottom: 1px solid var(--bevel-bottom);
      box-shadow: var(--shadow-extrude);
    }

    .neu-well {
      background: linear-gradient(180deg, #06080c 0%, #0b0e14 100%);
      border-radius: var(--r-well);
      border-top: 1px solid rgba(0, 0, 0, 0.85);
      border-left: 1px solid rgba(0, 0, 0, 0.65);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: var(--shadow-well);
    }

    /* Haptic Tactile Keys (Zero <button> Tags) */
    .haptic-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      user-select: none;
      cursor: pointer;
      border-radius: var(--r-pill);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.01) 48%, rgba(0, 0, 0, 0.16) 100%),
        linear-gradient(145deg, #1b212e, #10141d);
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      border-left: 1px solid rgba(255, 255, 255, 0.11);
      border-right: 1px solid rgba(0, 0, 0, 0.65);
      border-bottom: 1px solid rgba(0, 0, 0, 0.85);
      box-shadow: var(--shadow-key);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.84rem;
      padding: 10px 18px;
      text-decoration: none;
      transition: transform 140ms var(--ease-haptic), box-shadow 140ms var(--ease-haptic), border-color 180ms ease, color 180ms ease;
    }

    .haptic-key:hover {
      border-top-color: rgba(255, 255, 255, 0.34);
      color: #ffffff;
    }

    .haptic-key:active,
    .haptic-key.is-pressed {
      transform: translateY(2px) scale(0.965);
      border-top-color: rgba(0, 0, 0, 0.65);
      border-bottom-color: rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow-key-pressed);
    }

    .haptic-key:focus-visible {
      outline: 2px solid var(--led-ice);
      outline-offset: 3px;
    }

    .haptic-key.is-engaged {
      background:
        linear-gradient(180deg, rgba(56, 189, 248, 0.22) 0%, rgba(56, 189, 248, 0.04) 55%, rgba(0, 0, 0, 0.22) 100%),
        linear-gradient(145deg, #152333, #0e1520);
      border-top-color: rgba(125, 211, 252, 0.55);
      color: #bae6fd;
      box-shadow: inset 3px 3px 8px rgba(2, 5, 10, 0.82), 0 0 18px rgba(56, 189, 248, 0.18);
    }

    .haptic-primary {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0.04) 48%, rgba(0, 0, 0, 0.18) 100%),
        linear-gradient(145deg, #38bdf8 0%, #0284c7 60%, #0369a1 100%);
      border-top: 1.5px solid rgba(255, 255, 255, 0.72);
      border-left: 1px solid rgba(255, 255, 255, 0.4);
      border-bottom: 1.5px solid rgba(2, 32, 54, 0.95);
      color: #031019;
      font-weight: 800;
      box-shadow:
        8px 8px 20px #020306,
        0 0 24px rgba(56, 189, 248, 0.28),
        inset 0 1px 2px rgba(255, 255, 255, 0.65);
    }

    .haptic-primary:hover {
      color: #02080d;
      box-shadow: 10px 10px 24px #020306, 0 0 30px rgba(56, 189, 248, 0.42);
    }

    .haptic-danger {
      color: #fda4af;
      border-top-color: rgba(244, 63, 94, 0.35);
    }

    .haptic-danger:hover {
      color: #ffffff;
      border-top-color: rgba(244, 63, 94, 0.7);
      box-shadow: 7px 7px 16px #030407, 0 0 16px rgba(244, 63, 94, 0.22);
    }

    .mini-key {
      padding: 6px 13px;
      font-size: 0.75rem;
    }

    /* Top Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      padding: 14px 24px;
      border-radius: var(--r-pill);
    }

    .brand-cluster {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      padding: 3px;
      background: linear-gradient(145deg, #1f2636, #0d1017);
      border-top: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: 5px 5px 12px #030407, -3px -3px 9px rgba(40, 48, 66, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .brand-badge img {
      width: 100%;
      height: 100%;
      border-radius: 11px;
      object-fit: cover;
    }

    .brand-name {
      font-size: 1.28rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: var(--chrome-bright);
    }

    .brand-sub {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-dim);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .led-readout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      border-radius: var(--r-pill);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-dim);
    }

    .led-pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--led-emerald);
      box-shadow: 0 0 8px var(--led-emerald);
    }

    /* Admin Grid */
    .admin-grid {
      display: grid;
      grid-template-columns: 440px 1fr;
      gap: 24px;
      align-items: start;
    }

    .editor-chassis {
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 22px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .panel-title {
      font-size: 1.06rem;
      font-weight: 800;
      letter-spacing: -0.015em;
      color: var(--chrome-bright);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label {
      font-size: 0.77rem;
      font-weight: 700;
      color: var(--text-dim);
      letter-spacing: 0.02em;
    }

    .neu-input, .neu-select {
      width: 100%;
      padding: 11px 16px;
      border-radius: var(--r-pill);
      background: #06080c;
      border-top: 1px solid rgba(0, 0, 0, 0.9);
      border-left: 1px solid rgba(0, 0, 0, 0.75);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.11);
      box-shadow: var(--shadow-well);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.87rem;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .neu-input:focus, .neu-select:focus {
      border-bottom-color: rgba(56, 189, 248, 0.55);
      box-shadow: var(--shadow-well), 0 0 16px rgba(56, 189, 248, 0.14);
    }

    .neu-select option {
      background: #0f131c;
      color: #ffffff;
    }

    .quick-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }

    .toggle-well {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: var(--r-pill);
    }

    /* Right Catalog */
    .catalog-chassis {
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .catalog-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .rtdb-bar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 12px 14px;
    }

    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .track-plate {
      display: grid;
      grid-template-columns: 58px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 13px 16px;
      border-radius: var(--r-module);
      background:
        linear-gradient(165deg, rgba(255, 255, 255, 0.065) 0%, rgba(255, 255, 255, 0.01) 50%, rgba(0, 0, 0, 0.18) 100%),
        linear-gradient(145deg, #171c27, #0f131b);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      border-right: 1px solid rgba(0, 0, 0, 0.65);
      border-bottom: 1px solid rgba(0, 0, 0, 0.85);
      box-shadow: 6px 6px 14px #030407, -4px -4px 10px rgba(36, 44, 60, 0.22);
    }

    .track-plate.is-editing {
      border-top-color: rgba(125, 211, 252, 0.65);
      box-shadow: inset 3px 3px 9px rgba(2, 5, 10, 0.85), 0 0 20px rgba(56, 189, 248, 0.16);
    }

    .plate-art {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .plate-meta {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .plate-title {
      font-weight: 700;
      font-size: 0.96rem;
      color: var(--chrome-bright);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .plate-sub {
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .plate-url {
      font-size: 0.72rem;
      color: var(--text-mute);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .plate-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .toast-pill {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(130%);
      z-index: 99;
      padding: 11px 22px;
      border-radius: var(--r-pill);
      background: linear-gradient(160deg, #1b2230, #0d1017);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.85);
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--chrome-bright);
      transition: transform 260ms var(--ease-haptic);
      pointer-events: none;
    }

    .toast-pill.show {
      transform: translateX(-50%) translateY(0);
    }

    .app-footer {
      margin-top: auto;
      padding-top: 18px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-mute);
    }

    @media (max-width: 1024px) {
      .admin-grid {
        grid-template-columns: 1fr;
      }
      .editor-chassis {
        position: static;
      }
    }

    @media (max-width: 640px) {
      .shell {
        padding: 14px 14px 32px;
      }
      .topbar {
        border-radius: var(--r-chassis);
      }
      .form-row-2 {
        grid-template-columns: 1fr;
      }
      .track-plate {
        grid-template-columns: 1fr;
      }
      .rtdb-bar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <!-- Top Header -->
    <header class="topbar neu-chassis">
      <div class="brand-cluster">
        <div class="brand-badge">
          <img src="favicon.png" alt="Play Mine" onerror="this.style.display='none'" />
        </div>
        <div>
          <div class="brand-name">Play Mine — Studio Admin</div>
          <div class="brand-sub">Realtime Cloud Catalog Manager</div>
        </div>
      </div>

      <div class="header-actions">
        <div class="led-readout neu-well">
          <span class="led-pip" id="connLed"></span>
          <span id="connLabel">Connecting RTDB…</span>
        </div>
        <a href="https://play-mine.pages.dev" class="haptic-key" target="_blank" rel="noopener">
          Open Play Mine ↗
        </a>
      </div>
    </header>

    <!-- Main Admin Grid -->
    <main class="admin-grid">
      <!-- Left: Add / Edit Track Form -->
      <section class="editor-chassis neu-chassis">
        <div class="panel-head">
          <div class="panel-title" id="editorHeading">Add New Track</div>
          <div class="haptic-key mini-key" id="btnResetForm" role="button" tabindex="0">Clear</div>
        </div>

        <input type="hidden" id="editTrackId" value="" />

        <div class="form-group">
          <label for="trackUrl">Direct Audio URL (MP3 / FLAC / WAV / OGG) *</label>
          <input type="url" id="trackUrl" class="neu-input" placeholder="https://.../audio.mp3" required />
          <div class="quick-tools">
            <div class="haptic-key mini-key" id="btnProbeAudio" role="button" tabindex="0">
              Auto-Detect Duration
            </div>
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="trackTitle">Track Title *</label>
            <input type="text" id="trackTitle" class="neu-input" placeholder="Track Name" />
          </div>
          <div class="form-group">
            <label for="trackArtist">Artist *</label>
            <input type="text" id="trackArtist" class="neu-input" placeholder="Artist Name" />
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="trackAlbum">Album / Release</label>
            <input type="text" id="trackAlbum" class="neu-input" placeholder="Album Title" />
          </div>
          <div class="form-group">
            <label for="trackGenre">Genre</label>
            <input type="text" id="trackGenre" class="neu-input" placeholder="Electronic / Ambient" />
          </div>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="trackQuality">Quality Badge</label>
            <select id="trackQuality" class="neu-select">
              <option value="24-Bit / 96kHz Lossless">24-Bit / 96kHz Lossless</option>
              <option value="FLAC Studio Master">FLAC Studio Master</option>
              <option value="WAV Uncompressed PCM">WAV Uncompressed PCM</option>
              <option value="320kbps High-Bitrate">320kbps High-Bitrate</option>
              <option value="Hi-Res Cloud Stream">Hi-Res Cloud Stream</option>
            </select>
          </div>
          <div class="form-group">
            <label for="trackDuration">Duration (MM:SS)</label>
            <input type="text" id="trackDuration" class="neu-input" placeholder="03:30" />
          </div>
        </div>

        <div class="form-group">
          <label for="trackCover">Cover Artwork URL (Optional)</label>
          <input type="url" id="trackCover" class="neu-input" placeholder="https://.../cover.jpg" />
        </div>

        <div class="toggle-well neu-well">
          <span style="font-size: 0.84rem; font-weight: 600;">★ Pin as Featured Track</span>
          <div class="haptic-key mini-key" id="btnToggleFeatured" role="button" tabindex="0">Featured: OFF</div>
        </div>

        <div style="display:flex;gap:10px;margin-top:4px;">
          <div class="haptic-key haptic-primary" id="btnSaveTrack" role="button" tabindex="0" style="flex: 1;">
            Publish to Play Mine
          </div>
        </div>
      </section>

      <!-- Right: Published RTDB Catalog -->
      <section class="catalog-chassis neu-chassis">
        <div class="catalog-top">
          <div class="panel-title">Published Tracks (<span id="totalCount">0</span>)</div>
          <input type="text" id="adminSearch" class="neu-input" placeholder="Filter published tracks…" style="max-width: 260px;" />
        </div>

        <div class="rtdb-bar neu-well">
          <input type="url" id="rtdbUrlInput" class="neu-input" style="font-size:0.78rem;" aria-label="Firebase RTDB URL" />
          <div class="haptic-key mini-key" id="btnSaveDbUrl" role="button" tabindex="0">Update RTDB URL</div>
        </div>

        <div class="admin-list" id="adminList">
          <!-- Live synced items from RTDB -->
        </div>
      </section>
    </main>

    <footer class="app-footer">
      © 2026 Sanchar Koirala | All rights reserved
    </footer>
  </div>

  <div class="toast-pill" id="toastPill" role="status" aria-live="polite"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    const DEFAULT_RTDB_URL = "https://cloud-db-studio-default-rtdb.firebaseio.com";
    const currentDbUrl = localStorage.getItem("play_mine_rtdb_url") || DEFAULT_RTDB_URL;
    document.getElementById("rtdbUrlInput").value = currentDbUrl;

    const firebaseConfig = {
      apiKey: "AIzaSyDpCAXfhldRc1nCZDWlWNRbcMFjqAh8uPc",
      authDomain: "cloud-db-studio.firebaseapp.com",
      databaseURL: currentDbUrl,
      projectId: "cloud-db-studio"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const tracksRef = ref(db, "play_mine/tracks");

    const $ = (id) => document.getElementById(id);
    let tracksCache = [];
    let isFeatured = false;
    const previewAudio = new Audio();
    let previewingId = null;

    function triggerHaptic(ms = 10) {
      if (navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (_) {}
      }
    }

    function showToast(msg) {
      const el = $("toastPill");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.remove("show"), 2600);
    }

    function bindHapticKey(el, handler) {
      if (!el) return;
      el.addEventListener("pointerdown", () => triggerHaptic(10));
      el.addEventListener("click", handler);
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          triggerHaptic(12);
          el.classList.add("is-pressed");
          setTimeout(() => el.classList.remove("is-pressed"), 140);
          handler(e);
        }
      });
    }

    function buildCoverSvg(seed = "Play Mine") {
      let hash = 0;
      for (let i = 0; i < seed.length; i++) hash = seed.charCodeAt(i) + ((hash << 5) - hash);
      const hue = Math.abs(hash % 360);
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
        <defs><radialGradient id="g" cx="35%" cy="30%" r="75%"><stop offset="0%" stop-color="hsl(${hue},52%,36%)"/><stop offset="100%" stop-color="#07090d"/></radialGradient></defs>
        <rect width="200" height="200" fill="url(#g)"/>
        <circle cx="100" cy="100" r="46" fill="none" stroke="rgba(56,189,248,0.35)" stroke-width="2.5"/>
      </svg>`;
      return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
    }

    function formatDuration(sec) {
      if (!Number.isFinite(sec) || sec <= 0) return "";
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function resetForm() {
      $("editTrackId").value = "";
      $("trackUrl").value = "";
      $("trackTitle").value = "";
      $("trackArtist").value = "";
      $("trackAlbum").value = "";
      $("trackGenre").value = "";
      $("trackQuality").value = "24-Bit / 96kHz Lossless";
      $("trackDuration").value = "";
      $("trackCover").value = "";
      isFeatured = false;
      $("btnToggleFeatured").textContent = "Featured: OFF";
      $("btnToggleFeatured").classList.remove("is-engaged");
      $("editorHeading").textContent = "Add New Track";
      $("btnSaveTrack").textContent = "Publish to Play Mine";
      renderAdminList();
    }

    function loadTrackIntoEditor(track) {
      $("editTrackId").value = track.id;
      $("trackUrl").value = track.url || "";
      $("trackTitle").value = track.title || "";
      $("trackArtist").value = track.artist || "";
      $("trackAlbum").value = track.album || "";
      $("trackGenre").value = track.genre || "";
      $("trackQuality").value = track.quality || "24-Bit / 96kHz Lossless";
      $("trackDuration").value = track.duration || "";
      $("trackCover").value = track.coverUrl || "";
      isFeatured = Boolean(track.featured);
      $("btnToggleFeatured").textContent = `Featured: ${isFeatured ? "ON" : "OFF"}`;
      $("btnToggleFeatured").classList.toggle("is-engaged", isFeatured);
      $("editorHeading").textContent = `Editing: ${track.title}`;
      $("btnSaveTrack").textContent = "Save Changes";
      renderAdminList();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    bindHapticKey($("btnProbeAudio"), () => {
      const url = $("trackUrl").value.trim();
      if (!url) {
        showToast("Enter an audio URL first.");
        return;
      }
      showToast("Reading stream metadata…");
      const probe = new Audio();
      probe.preload = "metadata";
      probe.src = url;
      probe.addEventListener("loadedmetadata", () => {
        const dur = formatDuration(probe.duration);
        if (dur) {
          $("trackDuration").value = dur;
          showToast(`Verified • Duration: ${dur}`);
        }
        probe.src = "";
      });
      probe.addEventListener("error", () => {
        showToast("Unable to auto-read duration; enter MM:SS manually.");
      });
    });

    bindHapticKey($("btnToggleFeatured"), () => {
      isFeatured = !isFeatured;
      $("btnToggleFeatured").textContent = `Featured: ${isFeatured ? "ON" : "OFF"}`;
      $("btnToggleFeatured").classList.toggle("is-engaged", isFeatured);
    });

    bindHapticKey($("btnResetForm"), resetForm);

    bindHapticKey($("btnSaveTrack"), async () => {
      const url = $("trackUrl").value.trim();
      const title = $("trackTitle").value.trim();
      const artist = $("trackArtist").value.trim();

      if (!url || !title || !artist) {
        showToast("Audio URL, Track Title, and Artist are required.");
        return;
      }

      const editId = $("editTrackId").value.trim();
      const payload = {
        url,
        title,
        artist,
        album: $("trackAlbum").value.trim(),
        genre: $("trackGenre").value.trim() || "Lossless",
        quality: $("trackQuality").value,
        duration: $("trackDuration").value.trim() || "03:30",
        coverUrl: $("trackCover").value.trim(),
        featured: isFeatured,
        updatedAt: Date.now()
      };

      try {
        if (editId) {
          await update(ref(db, `play_mine/tracks/${editId}`), payload);
          showToast(`Updated "${title}" live.`);
        } else {
          payload.createdAt = Date.now();
          await set(push(tracksRef), payload);
          showToast(`Published "${title}" to Play Mine.`);
        }
        resetForm();
      } catch (err) {
        console.error(err);
        showToast("RTDB write failed. Verify database permissions.");
      }
    });

    bindHapticKey($("btnSaveDbUrl"), () => {
      const newUrl = $("rtdbUrlInput").value.trim().replace(/\/$/, "");
      if (!newUrl.startsWith("https://")) {
        showToast("Enter a valid https:// Firebase RTDB URL.");
        return;
      }
      localStorage.setItem("play_mine_rtdb_url", newUrl);
      showToast("RTDB URL updated. Reloading…");
      setTimeout(() => location.reload(), 650);
    });

    function renderAdminList() {
      const listEl = $("adminList");
      const q = $("adminSearch").value.toLowerCase().trim();
      const editingId = $("editTrackId").value;

      const filtered = tracksCache.filter((t) =>
        !q ||
        (t.title || "").toLowerCase().includes(q) ||
        (t.artist || "").toLowerCase().includes(q) ||
        (t.album || "").toLowerCase().includes(q)
      );

      $("totalCount").textContent = tracksCache.length;
      listEl.innerHTML = "";

      if (filtered.length === 0) {
        listEl.innerHTML = `
          <div class="neu-well" style="padding:36px 18px;text-align:center;color:var(--text-dim);font-size:0.88rem;">
            No tracks in RTDB yet. Add your first song on the left to publish it live to Play Mine.
          </div>
        `;
        return;
      }

      filtered.forEach((track) => {
        const plate = document.createElement("div");
        plate.className = `track-plate${track.id === editingId ? " is-editing" : ""}`;

        const cover = track.coverUrl && track.coverUrl.trim()
          ? track.coverUrl.trim()
          : buildCoverSvg((track.title || "") + (track.artist || ""));

        plate.innerHTML = `
          <img src="${cover}" alt="" class="plate-art" />
          <div class="plate-meta">
            <div class="plate-title">
              <span>${escapeHtml(track.title)}</span>
              ${track.featured ? '<span style="color:var(--led-amber);font-size:0.78rem;">★ Featured</span>' : ""}
            </div>
            <div class="plate-sub">${escapeHtml(track.artist)}${track.album ? " • " + escapeHtml(track.album) : ""} • ${escapeHtml(track.quality || "")} (${escapeHtml(track.duration || "--:--")})</div>
            <div class="plate-url">${escapeHtml(track.url)}</div>
          </div>
          <div class="plate-actions">
            <div class="haptic-key mini-key" data-act="preview" role="button" tabindex="0">
              ${previewingId === track.id ? "Stop" : "Test Play"}
            </div>
            <div class="haptic-key mini-key" data-act="edit" role="button" tabindex="0">
              Edit
            </div>
            <div class="haptic-key mini-key haptic-danger" data-act="delete" role="button" tabindex="0">
              Delete
            </div>
          </div>
        `;

        bindHapticKey(plate.querySelector('[data-act="preview"]'), () => {
          if (previewingId === track.id) {
            previewAudio.pause();
            previewingId = null;
            renderAdminList();
          } else {
            previewAudio.src = track.url;
            previewAudio.play().catch(() => showToast("Unable to play URL."));
            previewingId = track.id;
            renderAdminList();
          }
        });

        bindHapticKey(plate.querySelector('[data-act="edit"]'), () => {
          loadTrackIntoEditor(track);
        });

        const delBtn = plate.querySelector('[data-act="delete"]');
        let armed = false;
        bindHapticKey(delBtn, async () => {
          if (!armed) {
            armed = true;
            delBtn.textContent = "Confirm?";
            setTimeout(() => {
              armed = false;
              if (delBtn) delBtn.textContent = "Delete";
            }, 3000);
            return;
          }
          try {
            await remove(ref(db, `play_mine/tracks/${track.id}`));
            if ($("editTrackId").value === track.id) resetForm();
            showToast(`Deleted "${track.title}".`);
          } catch (_) {
            showToast("Failed to delete track.");
          }
        });

        listEl.appendChild(plate);
      });
    }

    $("adminSearch").addEventListener("input", renderAdminList);

    onValue(
      tracksRef,
      (snapshot) => {
        $("connLed").style.background = "var(--led-emerald)";
        $("connLabel").textContent = "RTDB Live Sync";
        const val = snapshot.val();
        if (val && typeof val === "object") {
          tracksCache = Object.entries(val)
            .map(([id, item]) => ({ id, ...item }))
            .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        } else {
          tracksCache = [];
        }
        renderAdminList();
      },
      (err) => {
        console.error(err);
        $("connLed").style.background = "var(--led-rose)";
        $("connLabel").textContent = "RTDB Error";
      }
    );
  </script>
</body>
</html>
